[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = [
    "ANN401",  # allow typing.Any where genuinely needed (LLM raw payloads)
    "B008",    # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # re-exports are intentional
"tests/**" = ["ANN"]         # test fns need no annotations to be readable

[tool.ruff.lint.isort]
# `tests` is first-party too; without this its imports sort as third-party.
known-first-party = ["app", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Async tests are collected without needing an @pytest.mark.asyncio on each one.
asyncio_mode = "auto"
# Every test runs on its own event loop; no state leaks between tests.
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
